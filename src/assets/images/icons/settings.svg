    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <g filter="url(#halo)">
    <mask id="jaw"><rect width="24" height="24" fill="#fff"/><path d="M16 8l6-6" stroke="#000" stroke-width="4.5"/></mask>
    <g mask="url(#jaw)"><circle cx="16" cy="8" r="4.6" stroke-width="2.8"/></g>
    <path d="M12.6 11.4L4.5 19.5" stroke-width="3.4"/>
  </g>
</svg>
